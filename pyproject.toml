[project]
name = "qin-pytorch-week-02"
version = "0.1.0"
description = "A classifier that has to make a decision"
requires-python = ">=3.12"
dependencies = [
    "matplotlib==3.11.2",
    "numpy==2.5.4",
    "pandas==3.1.1",
    "requests==2.34.2",
    "scikit-learn==1.9.1",
    "torch==2.15.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.reproduce]
train_smoke = ["-m", "src.main", "train", "--smoke", "--out", "runs/smoke"]
evaluate = [
    "-m",
    "src.main",
    "evaluate",
    "--checkpoint",
    "{checkpoint}",
    "--metrics-out",
    "{metrics_out}",
]
split = ["-m", "src.main", "split", "--out", "{split_out}"]
checkpoint_url = ""
metric_name = "test_pr_auc"
metric_value = 0.0
tolerance = 0.0
